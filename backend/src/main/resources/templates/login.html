<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI 策展师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f6fa; color: #1f2937;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff; border-radius: 16px; padding: 40px;
            width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.08);
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
        .sub { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 28px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #4F46E5; }
        .btn {
            width: 100%; padding: 11px; border: none; border-radius: 8px;
            background: #4F46E5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: #4338ca; }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; }
        .foot { text-align: center; margin-top: 18px; font-size: 13px; color: #6b7280; }
        .foot a { color: #4F46E5; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>AI 策展师</h1>
    <p class="sub">登录后管理你的作品集</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
        <div class="field">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="******">
        </div>
        <button type="submit" class="btn">登 录</button>
    </form>
    <p class="foot">还没有账号？<a href="/admin/register">立即注册</a></p>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const error = document.getElementById('error');
        error.style.display = 'none';
        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})
            });
            const data = await resp.json();
            if (resp.ok) {
                location.href = '/admin';
            } else {
                error.textContent = data.msg || data.message || '登录失败';
                error.style.display = 'block';
            }
        } catch (err) {
            error.textContent = '网络错误，请稍后重试';
            error.style.display = 'block';
        }
    });
</script>
</body>
</html>
