<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${portfolio.seoTitle != null and !portfolio.seoTitle.isEmpty()} ? ${portfolio.seoTitle} : (${portfolio.userName} + ' - 个人作品集')">个人作品集</title>
    <meta name="description"
          th:content="${portfolio.seoDescription != null and !portfolio.seoDescription.isEmpty()} ? ${portfolio.seoDescription} : (${portfolio.userName} + ' 的个人作品集')">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #111; color: #f3f4f6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px 96px; }
        .hero { text-align: center; padding: 48px 0 40px; }
        .avatar {
            width: 128px; height: 128px; border-radius: 50%; object-fit: cover;
            border: 4px solid rgba(255,255,255,.15); margin-bottom: 20px;
        }
        h1 { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
        .slogan {
            display: inline-block; margin-top: 14px; font-size: 15px; font-weight: 600;
            padding: 6px 18px; border-radius: 999px; color: #fff;
        }
        .bio { color: #9ca3af; max-width: 560px; margin: 16px auto 0; line-height: 1.8; }
        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px; margin-top: 40px;
        }
        .work {
            position: relative; border-radius: 16px; overflow: hidden;
            background: #1f2937; aspect-ratio: 4 / 3;
        }
        .work img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .5s ease;
        }
        .work:hover img { transform: scale(1.06); }
        .work-mask {
            position: absolute; inset: 0; padding: 24px;
            display: flex; flex-direction: column; justify-content: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,.85), transparent 60%);
            opacity: 0; transition: opacity .3s ease;
        }
        .work:hover .work-mask { opacity: 1; }
        .work-mask h3 { font-size: 18px; margin-bottom: 6px; }
        .work-mask p { font-size: 13px; color: #d1d5db; line-height: 1.6; }
        .footer { text-align: center; margin-top: 64px; color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <img class="avatar" th:if="${portfolio.avatarPath != null and !portfolio.avatarPath.isEmpty()}" th:src="${portfolio.avatarPath}" alt="头像">
        <h1 th:text="${portfolio.userName}">用户名</h1>
        <span class="slogan" th:if="${portfolio.slogan != null and !portfolio.slogan.isEmpty()}" th:text="${portfolio.slogan}"
              th:style="'background-color: ' + ${portfolio.themeColor}">口号</span>
        <p class="bio" th:text="${portfolio.bio}">个人简介</p>
    </div>

    <div class="gallery">
        <div class="work" th:each="project : ${projects}">
            <img th:if="${project.coverPath != null and !project.coverPath.isEmpty()}" th:src="${project.coverPath}" alt="封面">
            <div class="work-mask">
                <h3 th:text="${project.title}">作品标题</h3>
                <p th:text="${project.description}">作品描述</p>
            </div>
        </div>
    </div>

    <p class="footer" th:text="'Powered by ' + ${portfolio.userName} + ' · AI 策展师'">Footer</p>
</div>
</body>
</html>
