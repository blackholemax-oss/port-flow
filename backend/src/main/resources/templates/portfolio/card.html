<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${portfolio.seoTitle != null and !portfolio.seoTitle.isEmpty()} ? ${portfolio.seoTitle} : (${portfolio.userName} + ' - 个人作品集')">个人作品集</title>
    <meta name="description"
          th:content="${portfolio.seoDescription != null and !portfolio.seoDescription.isEmpty()} ? ${portfolio.seoDescription} : (${portfolio.userName} + ' 的个人作品集')">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #fafafa; color: #1f2937;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 64px 24px 96px; text-align: center; }
        .avatar {
            width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
            border: 4px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,.12); margin-bottom: 20px;
        }
        .avatar-fallback {
            width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 40px; font-weight: 700;
        }
        h1 { font-size: 32px; font-weight: 700; }
        .slogan {
            display: inline-block; margin-top: 10px; font-size: 15px; font-weight: 600;
            padding: 4px 14px; border-radius: 999px; color: #fff;
        }
        .bio { color: #6b7280; max-width: 520px; margin: 16px auto 0; line-height: 1.7; }
        .skills { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .skill {
            font-size: 13px; padding: 4px 12px; border-radius: 999px;
            border: 1px solid; background: #fff;
        }
        .projects {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px; margin-top: 48px; text-align: left;
        }
        .card {
            background: #fff; border-radius: 12px; overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .card-body { padding: 20px; }
        .card h3 { font-size: 17px; margin-bottom: 8px; }
        .card p { font-size: 14px; color: #6b7280; line-height: 1.6; }
        .footer { margin-top: 64px; color: #9ca3af; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <img class="avatar" th:if="${portfolio.avatarPath != null and !portfolio.avatarPath.isEmpty()}" th:src="${portfolio.avatarPath}" alt="头像">
    <div class="avatar-fallback" th:unless="${portfolio.avatarPath != null and !portfolio.avatarPath.isEmpty()}"
         th:style="'background-color: ' + ${portfolio.themeColor}" th:text="${#strings.substring(portfolio.userName, 0, 1)}">张</div>

    <h1 th:text="${portfolio.userName}">用户名</h1>
    <span class="slogan" th:if="${portfolio.slogan != null and !portfolio.slogan.isEmpty()}" th:text="${portfolio.slogan}"
          th:style="'background-color: ' + ${portfolio.themeColor}">口号</span>
    <p class="bio" th:text="${portfolio.bio}">个人简介</p>

    <div class="skills" th:if="${portfolio.skills != null and !portfolio.skills.isEmpty()}">
        <span class="skill" th:each="s : ${#strings.split(portfolio.skills, ',')}"
              th:text="${s}" th:style="'color: ' + ${portfolio.themeColor} + '; border-color: ' + ${portfolio.themeColor}">技能</span>
    </div>

    <div class="projects">
        <div class="card" th:each="project : ${projects}">
            <img th:if="${project.coverPath != null and !project.coverPath.isEmpty()}" th:src="${project.coverPath}" alt="封面">
            <div class="card-body">
                <h3 th:text="${project.title}">作品标题</h3>
                <p th:text="${project.description}">作品描述</p>
            </div>
        </div>
    </div>

    <p class="footer" th:text="'Powered by ' + ${portfolio.userName} + ' · AI 策展师'">Footer</p>
</div>
</body>
</html>
