<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${portfolio.seoTitle != null and !portfolio.seoTitle.isEmpty()} ? ${portfolio.seoTitle} : (${portfolio.userName} + ' - 个人作品集')">个人作品集</title>
    <meta name="description"
          th:content="${portfolio.seoDescription != null and !portfolio.seoDescription.isEmpty()} ? ${portfolio.seoDescription} : (${portfolio.userName} + ' 的个人作品集')">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, "Songti SC", "SimSun", serif;
            background: #fdfcf8; color: #1c1917;
        }
        .container { max-width: 820px; margin: 0 auto; padding: 72px 24px 96px; }
        .masthead { text-align: center; padding-bottom: 40px; border-bottom: 2px solid #1c1917; }
        .avatar {
            width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); margin-bottom: 18px;
        }
        h1 { font-size: 44px; font-weight: 700; letter-spacing: 2px; }
        .slogan { display: block; margin-top: 12px; font-size: 17px; font-style: italic; color: #57534e; }
        .bio { color: #57534e; max-width: 560px; margin: 20px auto 0; line-height: 1.9; font-size: 15px; }
        .section { margin-top: 56px; }
        .section-title {
            font-size: 22px; font-weight: 700; letter-spacing: 4px;
            padding-bottom: 12px; border-bottom: 1px solid #e7e5e4;
            display: flex; align-items: center; gap: 12px;
        }
        .section-title::before { content: ""; width: 8px; height: 8px; display: inline-block; }
        .entry {
            display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
            align-items: center; padding: 36px 0; border-bottom: 1px solid #e7e5e4;
        }
        .entry.reverse { direction: rtl; }
        .entry > * { direction: ltr; }
        .entry img { width: 100%; height: 240px; object-fit: cover; border-radius: 4px; }
        .entry h3 { font-size: 24px; margin-bottom: 12px; }
        .entry p { color: #57534e; line-height: 1.9; font-size: 15px; }
        .entry .no { font-size: 13px; letter-spacing: 2px; margin-bottom: 10px; }
        .footer { text-align: center; margin-top: 64px; color: #a8a29e; font-size: 13px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <div class="masthead">
        <img class="avatar" th:if="${portfolio.avatarPath != null and !portfolio.avatarPath.isEmpty()}" th:src="${portfolio.avatarPath}" alt="头像">
        <h1 th:text="${portfolio.userName}">用户名</h1>
        <span class="slogan" th:if="${portfolio.slogan != null and !portfolio.slogan.isEmpty()}" th:text="${portfolio.slogan}">口号</span>
        <p class="bio" th:text="${portfolio.bio}">个人简介</p>
    </div>

    <div class="section">
        <div class="section-title" th:style="'color: ' + ${portfolio.themeColor}">
            <span th:style="'background-color: ' + ${portfolio.themeColor}"></span> 作品集 WORKS
        </div>
        <div class="entry" th:each="project, stat : ${projects}"
             th:classappend="${stat.index % 2 == 1} ? 'reverse'">
            <div>
                <div class="no" th:style="'color: ' + ${portfolio.themeColor}"
                     th:text="'NO.' + ${stat.count}">NO.1</div>
                <h3 th:text="${project.title}">作品标题</h3>
                <p th:text="${project.description}">作品描述</p>
            </div>
            <img th:if="${project.coverPath != null and !project.coverPath.isEmpty()}" th:src="${project.coverPath}" alt="封面">
        </div>
    </div>

    <p class="footer" th:text="'Powered by ' + ${portfolio.userName} + ' · AI 策展师'">Footer</p>
</div>
</body>
</html>
