# 本地开发环境（H2 内存库，无需安装 MySQL/Redis）
# 激活方式：启动参数 --spring.profiles.active=dev 或环境变量 SPRING_PROFILES_ACTIVE=dev
# 默认（不激活任何 profile）使用 application.yml 主配置（MySQL + Redis）
spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379